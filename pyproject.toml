[project]
name = "remote-input"
version = "0.1.0"
description = "Type on your phone, land the text at the cursor on your desktop (HTTP -> fcitx5 -> screen)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "jeepney>=0.9.0",
]

[project.scripts]
remote-input = "remote_input.server:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

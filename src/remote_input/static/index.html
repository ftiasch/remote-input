<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>remote input</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 1rem; font: 16px/1.5 system-ui, sans-serif;
         background: #16161a; color: #e8e8ea; display: flex; flex-direction: column;
         height: 100dvh; box-sizing: border-box; }
  /* Every control lives in one row at the top: a phone soft keyboard slides up from
     the bottom, so bottom-anchored controls would get covered. */
  form { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: .75rem; }
  .controls { display: flex; align-items: center; gap: .5rem; }
  /* Segmented auto-send: three big targets instead of a number field, so a stray tap
     cannot nudge the mode past what you meant -- and no soft keyboard pops up for it. */
  .modes { flex: 1; min-width: 0; display: flex; border-radius: .5rem; overflow: hidden;
           border: 1px solid #3a3a44; }
  .modes label { flex: 1; min-width: 0; }
  .modes input { position: absolute; opacity: 0; pointer-events: none; }
  .modes span { display: block; padding: .6rem .25rem; text-align: center; font-size: .9rem;
                color: #9a9aa6; background: #1e1e24; white-space: nowrap; }
  .modes label + label span { border-left: 1px solid #3a3a44; }
  .modes input:checked + span { background: #4f7cff; color: #fff; font-weight: 600; }
  .controls button { flex: none; padding: .7rem 1.25rem; font: inherit; font-weight: 600;
                     border: 0; border-radius: .5rem; background: #4f7cff; color: white; }
  .controls button:active { background: #3a63d8; }
  #status { margin: 0; min-height: 1.5em; font-size: .9rem; color: #9a9aa6; }
  textarea { flex: 1; min-height: 0; padding: .75rem; font: inherit; resize: none;
             border-radius: .5rem; border: 1px solid #3a3a44; background: #1e1e24;
             color: inherit; }
</style>
<body>
<form id="form">
  <div class="controls">
    <div class="modes" role="radiogroup" aria-label="Auto-send">
      <label><input type="radio" name="mode" value="0"><span>Off</span></label>
      <label><input type="radio" name="mode" value="1"><span>1 s</span></label>
      <label><input type="radio" name="mode" value="0.1"><span>Instant</span></label>
    </div>
    <button>Send</button>
  </div>
  <p id="status"></p>
  <textarea id="text" placeholder="Type or dictate here…" autofocus></textarea>
</form>
<script>
"use strict";

const form = document.getElementById("form");
const text = document.getElementById("text");
const status = document.getElementById("status");
const modeGroup = document.querySelector(".modes");
const MODE_KEY = "remote-input.mode";

let timer = null;      // last word of the quiet-period timer
let ticker = null;     // countdown display
let deadline = 0;
let composing = false; // a mobile IME is composing text

function modeRadios() {
  return [...modeGroup.querySelectorAll("input")];
}

function remembered() {
  try { return localStorage.getItem(MODE_KEY); } catch { return null; }
}

function remember(value) {
  try { localStorage.setItem(MODE_KEY, value); } catch { /* private mode etc. */ }
}

/** Seconds to wait after typing stops; 0 (Off) turns auto-send off. */
function modeSeconds() {
  const checked = modeRadios().find((radio) => radio.checked);
  return checked ? Number.parseFloat(checked.value) : 0;
}

function stopAuto() {
  clearTimeout(timer);
  clearInterval(ticker);
  timer = ticker = null;
}

function tick() {
  const left = Math.max(0, deadline - Date.now()) / 1000;
  status.textContent = `Auto-send in ${left.toFixed(1)}s…`;
}

/** Commit modeSeconds() after typing stops; Off means no auto-send. */
function schedule() {
  stopAuto();
  const seconds = modeSeconds();
  if (!seconds || composing || !text.value) {
    status.textContent = "";
    return;
  }
  deadline = Date.now() + seconds * 1000;
  timer = setTimeout(send, seconds * 1000);
  ticker = setInterval(tick, 100);
  tick();
}

async function send() {
  stopAuto();
  if (!text.value) return;
  status.textContent = "Sending…";
  try {
    const response = await fetch("/api/commit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text.value }),
    });
    const result = await response.json();
    if (!response.ok) {
      status.textContent = result.error; // keep the text, never retry on its own
    } else if (result.committed) {
      status.textContent = "Sent";
      text.value = "";
    } else {
      status.textContent = "No focused input field — click the target window on your computer first";
    }
  } catch (error) {
    status.textContent = String(error);
  }
}

form.addEventListener("submit", (event) => {
  event.preventDefault();
  text.focus(); // the button sits at the top; keep the soft keyboard up for the next sentence
  send();
});

text.addEventListener("input", () => {
  if (!composing) schedule();
});

// Do not commit mid-composition: wait for compositionend, i.e. the settled text.
text.addEventListener("compositionstart", () => {
  composing = true;
  stopAuto();
});

text.addEventListener("compositionend", () => {
  composing = false;
  schedule();
});

const saved = remembered();
(modeRadios().find((radio) => radio.value === saved) ?? modeRadios()[0]).checked = true;

modeGroup.addEventListener("change", (event) => {
  remember(event.target.value);
  schedule();
});
</script>
